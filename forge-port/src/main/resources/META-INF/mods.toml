#clientSideOnly=true #optional, default=false

[[mods]]
modId="witherstormmod"
version="0.0.1-dev"
displayName="Wither Storm 26.3 Development Scaffold"
#updateJSONURL="https://example.com/updates.json" #optional
#displayURL="https://example.com/" #optional
#logoFile="witherstormmod.png" #optional
#credits="" #optional
authors="nonamecrackers2, Nazaru" #optional
